services:
  myhomeia:
    image: myhomeia-synology:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    container_name: myhomeia
    user: "1000:1000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:3080:3000"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      DB_PATH: /app/data/myhomeia.sqlite
      SITE_ORIGIN: ${SITE_ORIGIN:?Configurez SITE_ORIGIN dans le fichier .env}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      TZ: Europe/Paris
    volumes:
      - ./data:/app/data
